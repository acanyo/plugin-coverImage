apiVersion: v1alpha1
kind: Setting
metadata:
  name: plugin-coverImage-settings
spec:
  forms:
    - group: basic
      label: 基本设置
      formSchema:
        - $el: a
          attrs:
            href: "https://docs.lik.cc/plugins/cover-image/"
            class: "py-4 block"
            target: "_blank"
            style:
              color: "#1890ff"
              fontSize: "0.875em"
              display: "flex"
              align-items: "center"
          children:
            - $el: span
              children: "查看 封面图 帮助文档"
            - $el: img
              attrs:
                src: "/plugins/coverImage/assets/static/img/link.svg"
                width: "14px"
                height: "14px"
                style:
                  margin-left: "4px"
        - $el: span
          children: "加入交流群"
        - $el: img
          attrs:
            src: "https://www.lik.cc/upload/iShot_2025-03-03_16.03.00.png"
            width: "100px"
            height: "120px"
            style:
              margin-left: "80px"
        - $formkit: select
          name: fileGroup
          key: fileGroup
          id: fileGroup
          label: 附件存储组
          searchable: true
          help: "用于指定图片转存上传的默认附件存储分组"
          action: /apis/storage.halo.run/v1alpha1/groups?labelSelector=%21halo.run%2Fhidden&sort=metadata.creationTimestamp%2Cdesc
          requestOption:
            method: GET
            pageField: page
            sizeField: size
            totalField: total
            itemsField: items
            labelField: spec.displayName
            valueField: metadata.name
        - $formkit: select
          name: filePolicy
          key: filePolicy
          id: filePolicy
          label: 附件存储策略
          searchable: true
          help: "用于指定图片转存上传的默认附件存储策略"
          action: /apis/storage.halo.run/v1alpha1/policies
          requestOption:
            method: GET
            pageField: page
            sizeField: size
            totalField: total
            itemsField: items
            labelField: spec.displayName
            valueField: metadata.name
    - group: imageProcessing
      label: 图片压缩与 WebP
      formSchema:
        - $formkit: switch
          name: enabled
          id: coverImageProcessingEnabled
          label: 启用图片处理
          value: false
          help: "处理本插件新生成、获取或提取的封面；需要先配置附件存储策略，不修改已有正文图片。GIF、动态 WebP/APNG 和 SVG 保留原文件。"
        - $formkit: select
          if: "$get(coverImageProcessingEnabled).value === true"
          name: outputFormat
          label: 输出格式
          value: webp
          options:
            - label: WebP
              value: webp
            - label: 保留原格式
              value: original
          help: "支持 JPEG、PNG、WebP；转换 WebP 时保留透明背景。保留原格式且处理后更大时使用原文件。"
        - $formkit: number
          if: "$get(coverImageProcessingEnabled).value === true"
          name: quality
          label: 图片质量
          value: 80
          min: 1
          max: 100
          step: 1
          validation: required|number|min:1|max:100
          help: "JPEG / WebP 的有损质量，范围 1–100；PNG 使用无损压缩。"
        - $formkit: number
          if: "$get(coverImageProcessingEnabled).value === true"
          name: maxWidth
          label: 最大宽度（像素）
          value: 1920
          min: 0
          max: 8192
          step: 1
          validation: required|number|min:0|max:8192
          help: "超过此宽度时按比例缩小，不放大小图；填写 0 保留原尺寸。单张图片最大 16 MB / 4000 万像素。"
    - group: random
      label: 随机图设置
      formSchema:
        - $formkit: select
          name: defaultSource
          label: 默认随机图来源
          value: alcy
          options:
            - label: 栗次元随机图
              value: alcy
            - label: 风景
              value: views
            - label: 自定义接口
              value: custom
          help: "用于发布时自动补齐封面，并作为生成面板的默认来源。"
        - $formkit: verificationForm
          action: /apis/console.api.coverimage.lik.cc/v1alpha1/random-image/test
          label: 测试接口
          children:
            - $formkit: url
              name: apiUrl
              label: 自定义随机图接口
              placeholder: https://example.com/random
              help: "填写 GET 接口地址，支持直接图片、302 跳转图片、纯文本图片地址及 JSON。地址可包含查询参数。"
            - $formkit: select
              name: responseType
              label: 接口返回类型
              value: auto
              options:
                - label: 自动识别
                  value: auto
                - label: 图片文件
                  value: image
                - label: 纯文本图片地址
                  value: url
                - label: JSON
                  value: json
              help: "自动识别同时检查文件内容和 Content-Type，不依赖 URL 后缀。直接图片必须配置附件存储策略，以保存本次结果。"
            - $formkit: text
              name: jsonPath
              label: JSON 取图路径
              placeholder: data.url 或 data[0].url
              validation: length:0,512
              help: "留空识别 url、image、link 等常见字段。JSON 中有多个不同地址时需指定路径；支持 data.url、data[0].url、$.data.url、/data/0/url。选中数组时随机取一项。"
        - $el: p
          attrs:
            class: "text-sm text-gray-500"
          children: "使用当前填写的参数测试，无需先保存。绿色勾表示已获取到有效图片；失败时悬停错误标记查看原因。测试不上传附件、不修改文章，修改参数后请重新测试。"
    - group: ai
      label: AI 生成设置
      formSchema:
        - $formkit: textarea
          name: promptTemplate
          key: promptTemplate
          id: promptTemplate
          label: 默认提示词
          value: "请为这篇博客文章创作一张适合作为文章封面的横版图片。创作要求：准确提炼文章主题，突出核心概念；构图简洁、主体明确，适合 16:9 横版展示；使用高级、统一的视觉风格，保证主体清晰、层次分明；不要生成任何文字、字母、Logo、水印或边框；避免杂乱背景、低清晰度、畸形物体和重复元素。文章标题：{title}。文章内容摘要：{content}"
          help: "生成页可临时覆盖此提示词；支持 {title} 和 {content} 占位符"
          rows: 6
