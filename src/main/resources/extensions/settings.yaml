apiVersion: v1alpha1
kind: Setting
metadata:
  name: plugin-coverImage-settings
spec:
  forms:
    - group: basic
      label: 基本设置
      formSchema:
        - $el: a
          attrs:
            href: "https://docs.lik.cc/plugins/cover-image/"
            class: "py-4 block"
            target: "_blank"
            style:
              color: "#1890ff"
              fontSize: "0.875em"
              display: "flex"
              align-items: "center"
          children:
            - $el: span
              children: "查看 封面图 帮助文档"
            - $el: img
              attrs:
                src: "/plugins/coverImage/assets/static/img/link.svg"
                width: "14px"
                height: "14px"
                style:
                  margin-left: "4px"
        - $el: span
          children: "加入交流群"
        - $el: img
          attrs:
            src: "https://www.lik.cc/upload/iShot_2025-03-03_16.03.00.png"
            width: "100px"
            height: "120px"
            style:
              margin-left: "80px"
        - $formkit: select
          name: fileGroup
          key: fileGroup
          id: fileGroup
          label: 附件存储组
          searchable: true
          help: "用于指定图片转存上传的默认附件存储分组"
          action: /apis/storage.halo.run/v1alpha1/groups?labelSelector=%21halo.run%2Fhidden&sort=metadata.creationTimestamp%2Cdesc
          requestOption:
            method: GET
            pageField: page
            sizeField: size
            totalField: total
            itemsField: items
            labelField: spec.displayName
            valueField: metadata.name
        - $formkit: select
          name: filePolicy
          key: filePolicy
          id: filePolicy
          label: 附件存储策略
          searchable: true
          help: "用于指定图片转存上传的默认附件存储策略"
          action: /apis/storage.halo.run/v1alpha1/policies
          requestOption:
            method: GET
            pageField: page
            sizeField: size
            totalField: total
            itemsField: items
            labelField: spec.displayName
            valueField: metadata.name
    - group: ai
      label: AI 生成设置
      formSchema:
        - $formkit: textarea
          name: promptTemplate
          key: promptTemplate
          id: promptTemplate
          label: 默认提示词
          value: "请为这篇博客文章创作一张适合作为文章封面的横版图片。创作要求：准确提炼文章主题，突出核心概念；构图简洁、主体明确，适合 16:9 横版展示；使用高级、统一的视觉风格，保证主体清晰、层次分明；不要生成任何文字、字母、Logo、水印或边框；避免杂乱背景、低清晰度、畸形物体和重复元素。文章标题：{title}。文章内容摘要：{content}"
          help: "生成页可临时覆盖此提示词；支持 {title} 和 {content} 占位符"
          rows: 6
